name: PolicyAware Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  policyaware-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Official GitHub Action for PolicyAware pull-request scans,
      # annotations, SARIF, and report artifacts.
      # See: https://github.com/ktirupati/policyaware-action
      - uses: ktirupati/policyaware-action@v1
