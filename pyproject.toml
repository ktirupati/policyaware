[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "policyaware"
version = "0.4.1"
description = "Policy-aware AI gateway and agent control plane for enterprise LLM, RAG, MCP tool, and AI agent applications."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Krishna Kishor Tirupati" }
]
keywords = [
  "llm",
  "ai-gateway",
  "agent-control-plane",
  "policy",
  "rag",
  "agents",
  "governance",
  "audit",
  "guardrails",
  "mcp",
  "mcp-governance",
  "pii-redaction",
  "model-routing",
  "llm-governance",
  "local-code-scan"
]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "tomli>=2.0; python_version < '3.11'"
]
providers = [
  "boto3>=1.34"
]
azure = [
  "azure-identity>=1.16",
  "azure-storage-file-datalake>=12.14"
]
gcp = [
  "google-cloud-storage>=2.14"
]
privacy = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7"
]
guardrails = [
  "nemoguardrails>=0.10",
  "guardrails-ai>=0.5"
]
nemo = [
  "nemoguardrails>=0.10"
]
guardrails-ai = [
  "guardrails-ai>=0.5"
]
haystack = [
  "haystack-ai>=2.0"
]
presidio = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7"
]
ml = [
  "transformers>=4.40",
  "torch>=2.2"
]
onnx = [
  "transformers>=4.40",
  "optimum[onnxruntime]>=1.17"
]
all-ml = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
  "transformers>=4.40",
  "torch>=2.2",
  "optimum[onnxruntime]>=1.17"
]
all = [
  "azure-identity>=1.16",
  "azure-storage-file-datalake>=12.14",
  "boto3>=1.34",
  "google-cloud-storage>=2.14",
  "haystack-ai>=2.0",
  "nemoguardrails>=0.10",
  "guardrails-ai>=0.5",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
  "transformers>=4.40",
  "torch>=2.2",
  "optimum[onnxruntime]>=1.17"
]
full = [
  "azure-identity>=1.16",
  "azure-storage-file-datalake>=12.14",
  "boto3>=1.34",
  "google-cloud-storage>=2.14",
  "haystack-ai>=2.0",
  "nemoguardrails>=0.10",
  "guardrails-ai>=0.5",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
  "transformers>=4.40",
  "torch>=2.2",
  "optimum[onnxruntime]>=1.17"
]

[project.urls]
Homepage = "https://ktirupati.github.io/policyaware/"
Documentation = "https://ktirupati.github.io/policyaware/"
Repository = "https://github.com/ktirupati/policyaware"
Issues = "https://github.com/ktirupati/policyaware/issues"
Discussions = "https://github.com/ktirupati/policyaware/discussions"
Feedback = "https://docs.google.com/forms/d/e/1FAIpQLSc2QcQydjXZ0YF9bbVSpudoM5y8noxIP5jU-acVmjlyvf6Slg/viewform"
Testimonials = "https://github.com/ktirupati/policyaware/discussions/categories/show-and-tell"
LinkedIn = "https://www.linkedin.com/in/krishna-tirupati/"
Changelog = "https://github.com/ktirupati/policyaware/blob/main/CHANGELOG.md"

[project.scripts]
policyaware = "policyaware.cli:app"

[tool.hatch.build]
exclude = [
  "/docs/~$*.docx"
]

[tool.hatch.build.targets.wheel]
packages = ["src/policyaware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
