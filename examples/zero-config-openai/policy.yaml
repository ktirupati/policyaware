id: zero_config_openai
schema_version: "0.2"
default: deny

rules:
  - name: deny_secrets
    effect: deny
    when:
      data.contains_secrets: true

  - name: redact_pii_for_developers
    effect: transform
    action: redact
    when:
      data.contains_pii: true
      user.role_in:
        - billing_admin

  - name: allow_low_risk_billing_admin
    effect: allow
    when:
      user.role_in:
        - billing_admin
      risk.tier_in:
        - low
        - medium
