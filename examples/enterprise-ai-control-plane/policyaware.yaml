id: enterprise_ai_control_plane_policy
schema_version: "0.2"
default: deny

rules:
  - name: deny_secret_leakage
    effect: deny
    when:
      data.contains_secrets: true

  - name: redact_pii_for_support
    effect: transform
    action: redact
    when:
      data.contains_pii: true
      user.role_in: ["support_agent", "manager"]

  - name: require_approval_for_regulated_or_high_risk
    effect: require_approval
    when:
      risk.tier_in: ["high", "critical"]

  - name: allow_medium_risk_support_work
    effect: allow
    when:
      user.role_in: ["support_agent", "manager"]
      request.region_in: ["us", "eu"]
      risk.tier_in: ["low", "medium"]
