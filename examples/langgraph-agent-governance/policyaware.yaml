id: langgraph_agent_policy
schema_version: "0.2"
default: deny

rules:
  - name: deny_secrets
    effect: deny
    when:
      data.contains_secrets: true

  - name: redact_pii
    effect: transform
    action: redact
    when:
      data.contains_pii: true

  - name: require_approval_for_high_risk_agent_work
    effect: require_approval
    when:
      risk.tier_in: ["high", "critical"]

  - name: allow_support_graph_nodes
    effect: allow
    when:
      user.role_in: ["support_agent", "manager"]
      request.region_in: ["us", "eu"]
      risk.tier_in: ["low", "medium"]
