id: healthcare_hipaa_ai_governance
schema_version: "0.3"
default: deny

rules:
  - name: deny_secret_leakage
    effect: deny
    when:
      data.contains_secrets: true

  - name: redact_phi_for_non_clinical_roles
    effect: transform
    action: redact
    when:
      data.contains_phi: true
      user.role_not_in: ["clinician", "privacy_admin", "compliance_officer"]

  - name: redact_pii_for_standard_users
    effect: transform
    action: redact
    when:
      data.contains_pii: true
      user.role_not_in: ["privacy_admin", "compliance_officer"]

  - name: require_approval_for_high_risk_healthcare
    effect: require_approval
    when:
      risk.tier_in: ["high", "critical"]

  - name: allow_clinical_support_low_medium
    effect: allow
    when:
      user.role_in: ["clinician", "care_manager", "privacy_admin", "compliance_officer"]
      request.region_in: ["us"]
      risk.tier_in: ["low", "medium"]
